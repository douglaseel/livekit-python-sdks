# Builds the reactor-livekit-transport-client wheels (this fork's build of
# livekit-rtc) and publishes them to PyPI and as a GitHub Release.
#
# A release is a tag "reactor-rtc-v<livekit.rtc __version__>", for example
# "reactor-rtc-v1.2.0-1": the upstream release this branch is based on, and
# this fork's Nth release of it. PEP 440 reads "-N" as a post-release, so PyPI
# lists 1.2.0-1 as 1.2.0.post1.
# The wheels embed
# the livekit-ffi build that the rust-sdks submodule's download_ffi.py fetches
# from reactor-team/livekit-rust-sdks releases, so that FFI release must exist
# first. workflow_dispatch builds and smoke-tests without publishing.
#
# PyPI publishing is trusted publishing (OIDC): the PyPI project
# reactor-livekit-transport-client trusts this repository, this workflow file
# and the "pypi" environment. No token is stored here.
name: PyPI release

on:
  push:
    tags:
      - "reactor-rtc-v[0-9]*.[0-9]*.[0-9]*-[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_DIR: ./livekit-rtc
  DIST_NAME: reactor-livekit-transport-client

jobs:
  build_wheels:
    name: Build wheels (${{ matrix.os }} ${{ matrix.archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archs: x86_64
          - os: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-latest
            archs: arm64
    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          submodules: true

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' livekit/rtc/version.py)
          test "${GITHUB_REF_NAME}" = "reactor-rtc-v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        id: setup-python
        with:
          python-version: "3.11"

      - name: Build wheels
        run: pipx run --python '${{ steps.setup-python.outputs.python-path }}' cibuildwheel==3.3.1 --output-dir dist
        env:
          CIBW_ARCHS: ${{ matrix.archs }}

      - name: Smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          # grep, not head: head closes the pipe early and pipefail fails the step.
          /tmp/smoke/bin/pip show "${DIST_NAME}" | grep -E "^(Name|Version):"
          cd /tmp && /tmp/smoke/bin/python -c "
          from livekit import rtc
          from livekit.rtc._ffi_client import FfiClient
          FfiClient.instance  # loads the bundled liblivekit_ffi
          rtc.RtcConfiguration(ice_forwarder=rtc.IceForwarder(
              addresses=['203.0.113.10:443'],
              credentials=rtc.IceCredentials(ufrag='abcd', pwd='a' * 22),
              local_port=50001))
          print('ok', rtc.__version__)
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rtc-wheels-${{ matrix.os }}-${{ matrix.archs }}
          path: livekit-rtc/dist/*.whl

  # Publishes once the Linux wheels exist, also when the macOS build did not
  # run: the Linux wheels are the ones deployments use. A macOS wheel built
  # later is added to the same version by running the tag again
  # (skip-existing keeps the files already uploaded).
  pypi:
    name: Publish to PyPI
    needs: build_wheels
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reactor-livekit-transport-client
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Require the Linux wheels
        run: |
          ls dist
          ls dist/*manylinux*x86_64*.whl dist/*manylinux*aarch64*.whl

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  github_release:
    name: Publish GitHub release
    needs: pypi
    if: ${{ always() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${DIST_NAME} wheels built from ${GITHUB_SHA}: https://pypi.org/project/${DIST_NAME}/"
